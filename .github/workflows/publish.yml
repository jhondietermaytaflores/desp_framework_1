name: Despliegue en docker hub

on:
    push:
        branches:
                - main

jobs:
    build-and-push:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout del codigo
              uses: actions/checkout@v6

            - name: Iniciar sesion en docker hub
              uses: docker/login-action@v4
              with:
                    username: ${{ secrets.DOCKER_USERNAME }}
                    password: ${{ secrets.DOCKER_PASSWORD }}

            - name: COnfigurar docker build
              uses: docker/setup-buildx-action@v3

            - name: Construir y subir imagen en dockerhub
              uses: docker/build-push-action@v5
              with: 
                  context: .
                  file: ./Dockerfile
                  push: true
                  tags: |
                      ${{ secrets.DOCKER_USERNAME }}/mi-web-estatica:latest
                      ${{ secrets.DOCKER_USERNAME }}/mi-web-estatica:${{github.sha}}

            - name: Despliegue a vm por ssh
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: 163.176.183.199
                  username: ubuntu
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  script: |
                      sudo docker pull ${{ secrets.DOCKER_USERNAME }}/mi-web-estatica:latest
                      sudo docker stop prueba-web || true
                      sudo docker rm prueba-web || true
                      sudo docker run -d -p 80:80 --name prueba-web ${{ secrets.DOCKER_USERNAME }}/mi-web-estatica:latest